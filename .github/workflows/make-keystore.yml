# ─────────────────────────────────────────────────────────────
# ساخت کلید امضا (keystore) — فقط یک بار!
#
# این کلید «امضای اپ تو» است؛ برای همهٔ نسخه‌های بعدی باید همان یک کلید
# را نگه داری (اگر گم شود، نمی‌توانی آپدیت روی نسخهٔ قبلی نصب کنی).
#
# روش استفاده:
#   1) تب Actions → «ساخت کلید امضا» → Run workflow
#   2) یک رمز وارد کن (یادداشت کن!) → Run
#   3) از Artifacts فایل‌ها را دانلود کن:
#        • plannerman.keystore           → جای امن (بکاپ!)
#        • plannerman.keystore.base64.txt → محتوایش را برای secret
#          KEYSTORE_BASE64 استفاده کن
#        • secrets-values.txt            → مقادیر بقیهٔ secretها
#   4) در مخزن: Settings → Secrets and variables → Actions → ۴ secret بساز
# ─────────────────────────────────────────────────────────────
name: ساخت کلید امضا (keystore)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "رمز keystore (حداقل ۶ کاراکتر — حتماً یادداشت کن)"
        required: true
      alias:
        description: "نام مستعار کلید (پیش‌فرض: plannerman)"
        required: false
        default: "plannerman"

jobs:
  make-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: ساخت keystore با keytool
        env:
          STORE_PASS: ${{ inputs.store_password }}
          ALIAS: ${{ inputs.alias }}
        run: |
          keytool -genkeypair -v \
            -keystore plannerman.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=Planner Man, OU=Dev, O=PlannerMan, L=Tehran, C=IR"
          base64 -w0 plannerman.keystore > plannerman.keystore.base64.txt

          {
            echo "KEYSTORE_BASE64  ← محتوای کامل فایل plannerman.keystore.base64.txt"
            echo "KEYSTORE_PASSWORD ← $STORE_PASS"
            echo "KEY_ALIAS         ← $ALIAS"
            echo "KEY_PASSWORD      ← $STORE_PASS  (می‌توانی همان رمز keystore را بگذاری)"
          } > secrets-values.txt

          {
            echo "راهنما:"
            echo "1) فایل plannerman.keystore را در جای خیلی امن نگه دار (گم شدنش = غیرممکن شدن آپدیت اپ)"
            echo "2) در گیت‌هاب: Settings → Secrets and variables → Actions → New repository secret"
            echo "3) چهار secret بساز: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            echo "   مقادیر داخل همین فایل‌ها است."
            echo "4) حالا workflow «ساخت APK اندروید» را اجرا کن — نسخهٔ release با این کلید امضا می‌شود."
          } > README.txt

      - name: آپلود فایل‌های کلید
        uses: actions/upload-artifact@v4
        with:
          name: plannerman-keystore
          path: |
            plannerman.keystore
            plannerman.keystore.base64.txt
            secrets-values.txt
            README.txt
          if-no-files-found: error
          retention-days: 7
